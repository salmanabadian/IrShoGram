name: Flutter checks

on:
  push:
    branches: [main, firebase-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Build local preview APK (no Google sign-in required)
        run: flutter build apk --release --dart-define=IRSHOGRAM_PREVIEW=true
      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: irshogram-preview-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Restore Firebase Android configuration
        if: ${{ env.FIREBASE_ANDROID_CONFIG_BASE64 != '' }}
        run: |
          echo "$FIREBASE_ANDROID_CONFIG_BASE64" | base64 --decode > android/app/google-services.json
      - name: Validate Firebase Google Sign-In configuration
        if: ${{ env.FIREBASE_ANDROID_CONFIG_BASE64 != '' }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("android/app/google-services.json").read_text())
          clients = config.get("client", [])
          matching = [
              item for item in clients
              if item.get("client_info", {}).get("android_client_info", {}).get("package_name")
              == "com.irshogram.app"
          ]
          if not matching:
              raise SystemExit(
                  "Firebase Android config does not contain package com.irshogram.app. "
                  "Register this exact package in Firebase and replace the protected config secret."
              )
          oauth_clients = matching[0].get("oauth_client", [])
          if not any(item.get("client_type") == 3 for item in oauth_clients):
              raise SystemExit(
                  "Firebase config has no Google Web OAuth client (client_type 3). "
                  "Enable Google sign-in, configure the OAuth client, download a fresh "
                  "google-services.json, and update the protected config secret."
              )
          web_client_ids = [item.get('client_id', '') for item in oauth_clients if item.get('client_type') == 3]
          web_client_id = next((value for value in web_client_ids if value.endswith('.apps.googleusercontent.com')), '')
          if not web_client_id:
              raise SystemExit('The Firebase config has no valid Web OAuth client ID.')
          with open(__import__('os').environ['GITHUB_ENV'], 'a') as env:
              env.write(f'GOOGLE_SERVER_CLIENT_ID={web_client_id}\\n')
          print('Firebase Android package and Web OAuth client ID are present.')
          PY
      - name: Build Android APK
        if: ${{ env.FIREBASE_ANDROID_CONFIG_BASE64 != '' }}
        run: flutter build apk --release --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"
      - name: Upload APK
        if: ${{ env.FIREBASE_ANDROID_CONFIG_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: irshogram-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Explain skipped APK build
        if: ${{ env.FIREBASE_ANDROID_CONFIG_BASE64 == '' }}
        run: echo "APK build skipped. Add the repository secret FIREBASE_ANDROID_CONFIG_BASE64 to enable Firebase-configured Android builds."
