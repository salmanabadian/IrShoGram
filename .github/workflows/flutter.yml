name: Flutter checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Restore Firebase Android configuration
        if: ${{ env.FIREBASE_ANDROID_CONFIG_BASE64 != '' }}
        run: |
          echo "$FIREBASE_ANDROID_CONFIG_BASE64" | base64 --decode > android/app/google-services.json
      - name: Build Android APK
        if: ${{ env.FIREBASE_ANDROID_CONFIG_BASE64 != '' }}
        run: flutter build apk --release
      - name: Upload APK
        if: ${{ env.FIREBASE_ANDROID_CONFIG_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: irshogram-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Explain skipped APK build
        if: ${{ env.FIREBASE_ANDROID_CONFIG_BASE64 == '' }}
        run: echo "APK build skipped. Add the repository secret FIREBASE_ANDROID_CONFIG_BASE64 to enable Firebase-configured Android builds."
